version: "3.8"

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/prices.db:/app/prices.db
    environment:
      - PYTHONPATH=/app
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - flight-watcher

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - flight-watcher

networks:
  flight-watcher:
    driver: bridge
