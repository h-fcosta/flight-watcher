<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - Flight Watcher</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-plane"></i> Flight Watcher
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="/"
                ><i class="fas fa-tachometer-alt"></i> Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/routes"
                ><i class="fas fa-route"></i> Rotas</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/offers"
                ><i class="fas fa-plane"></i> Ofertas</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/deals"
                ><i class="fas fa-tags"></i> Promoções</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/docs" target="_blank"
                ><i class="fas fa-book"></i> API Docs</a
              >
            </li>
          </ul>

          <ul class="navbar-nav">
            <li class="nav-item">
              <span class="navbar-text" id="system-status">
                <i class="fas fa-circle text-success"></i> Sistema Online
              </span>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <main class="container mt-4">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="bg-light mt-5 py-4">
      <div class="container text-center">
        <p class="text-muted mb-0">
          Flight Watcher &copy; 2025 |
          <a href="/api/status/health" target="_blank">Status da API</a> |
          <a href="/docs" target="_blank">Documentação</a>
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/js/app.js"></script>

    {% block scripts %}{% endblock %}
  </body>
</html>
