{% extends "base.html" %} {% block title %}Promoções{% endblock %} {% block
content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-tag"></i> Promoções Encontradas</h2>
        <div>
          <button
            class="btn btn-outline-primary"
            onclick="deals.refreshDeals()"
          >
            <i class="fas fa-sync"></i> Atualizar
          </button>
          <button class="btn btn-primary" onclick="deals.exportDeals()">
            <i class="fas fa-download"></i> Exportar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form id="filter-form" class="row g-3">
            <div class="col-md-2">
              <label class="form-label">Origem</label>
              <input
                type="text"
                class="form-control"
                name="origin"
                placeholder="Ex: GRU"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Destino</label>
              <input
                type="text"
                class="form-control"
                name="destination"
                placeholder="Ex: JFK"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Preço Máximo</label>
              <input
                type="number"
                class="form-control"
                name="max_price"
                step="0.01"
                placeholder="R$ 1000"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Data Início</label>
              <input type="date" class="form-control" name="date_from" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Data Fim</label>
              <input type="date" class="form-control" name="date_to" />
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-outline-primary me-2">
                <i class="fas fa-filter"></i> Filtrar
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="deals.clearFilters()"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Estatísticas Rápidas -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card text-center bg-success text-white">
        <div class="card-body">
          <h3 id="total-deals">-</h3>
          <p class="mb-0">Total de Promoções</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center bg-primary text-white">
        <div class="card-body">
          <h3 id="best-deal">-</h3>
          <p class="mb-0">Melhor Preço</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center bg-warning text-white">
        <div class="card-body">
          <h3 id="avg-saving">-</h3>
          <p class="mb-0">Economia Média</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center bg-info text-white">
        <div class="card-body">
          <h3 id="today-deals">-</h3>
          <p class="mb-0">Promoções Hoje</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Lista de Promoções -->
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div
          class="card-header d-flex justify-content-between align-items-center"
        >
          <h5 class="mb-0">Lista de Promoções</h5>
          <div class="d-flex align-items-center">
            <span class="me-3">Ordenar por:</span>
            <select
              class="form-select form-select-sm"
              id="sort-select"
              style="width: auto"
            >
              <option value="date_desc">Data (mais recente)</option>
              <option value="date_asc">Data (mais antiga)</option>
              <option value="price_asc">Preço (menor)</option>
              <option value="price_desc">Preço (maior)</option>
              <option value="saving_desc">Economia (maior)</option>
            </select>
          </div>
        </div>
        <div class="card-body">
          <div id="deals-list">
            <!-- Conteúdo carregado dinamicamente -->
          </div>

          <!-- Paginação -->
          <nav aria-label="Navegação das promoções" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
              <!-- Paginação gerada dinamicamente -->
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Detalhes da Promoção -->
<div class="modal fade" id="dealDetailsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalhes da Promoção</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body" id="deal-details-content">
        <!-- Conteúdo carregado dinamicamente -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Fechar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          onclick="deals.shareDeal()"
        >
          <i class="fas fa-share"></i> Compartilhar
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', path='js/deals.js') }}"></script>
{% endblock %}
